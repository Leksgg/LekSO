# Terminal de LekSO: paleta propia y copiar/pegar como en cualquier otra aplicación.
font_family      DejaVu Sans Mono
font_size        11
window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no
update_check_interval 0
allow_remote_control no
cursor_blink_interval 0

# Seleccionar con el ratón copia solo.
copy_on_select clipboard

# Ctrl+C copia si hay texto seleccionado; si no, interrumpe el programa (como en Windows Terminal).
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

background #10151b
foreground #dfe6ee
selection_background #16384a
selection_foreground #dfe6ee
cursor #4cc3e0
color0  #1c2530
color8  #2a3644
color1  #f08a82
color9  #f08a82
color2  #58c987
color10 #58c987
color3  #f0b24a
color11 #f0b24a
color4  #4cc3e0
color12 #7fd6ec
color5  #b59cf0
color13 #b59cf0
color6  #4cc3e0
color14 #7fd6ec
color7  #dfe6ee
color15 #ffffff
