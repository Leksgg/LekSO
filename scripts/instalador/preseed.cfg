# Instalación de LeksSO: borra el disco que elijas, lo cifra (opcional) y no necesita internet.
# Va en el USB de instalación (/leksso/preseed.cfg) y se activa desde el menú de arranque.
#
# Lo que decide quien instala (el instalador lo pregunta): qué disco borrar, su nombre de usuario,
# su contraseña, la contraseña del cifrado del disco y la confirmación final de que se borra todo.
# Este archivo es la variante «disco cifrado, con contraseña». construir-iso.sh genera las otras tres (sin cifrar
# y/o sin contraseña de usuario) y las ofrece como entradas del menú de arranque.
# Nada de eso lo genera ni lo guarda el instalador.

# --- Idioma, teclado y hora ---
d-i debian-installer/locale string es_ES.UTF-8
d-i debian-installer/language string es
d-i debian-installer/country string ES
d-i keyboard-configuration/xkb-keymap select es
d-i console-setup/ask_detect boolean false
d-i time/zone string Europe/Madrid
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# --- Red: opcional. Si hay cable se usa; si no, se sigue sin red (todo va en el USB) ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string leksso
d-i netcfg/get_domain string
d-i netcfg/hostname string leksso
d-i netcfg/dhcp_timeout string 10
d-i netcfg/link_wait_timeout string 5
d-i hw-detect/load_firmware boolean true

# --- Paquetes: solo los del USB ---
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# --- Usuario: sin root; el primer usuario será administrador (sudo) ---
d-i passwd/root-login boolean false

# --- Disco: LVM cifrado con swap para hibernar (la receta la genera receta.sh según la RAM) ---
d-i partman/early_command string sh /cdrom/leksso/receta.sh
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-crypto/erase_data boolean false
# Se dejan SIN responder, para que decidas tú: partman-auto/disk (qué disco), la contraseña del cifrado y
# partman/confirm (la confirmación de borrado).

# --- Arranque ---
d-i grub-installer/only_debian boolean false
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# --- Al terminar: copia el paquete de LeksSO al disco y lo instala con el instalador firmado ---
d-i preseed/late_command string \
  mkdir -p /target/opt/leksso-instalacion; \
  cp -a /cdrom/leksso/. /target/opt/leksso-instalacion/; \
  in-target sh /opt/leksso-instalacion/postinstalar.sh

d-i finish-install/reboot_in_progress note
